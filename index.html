<style>
/* Layout: one study card centred under a filter bar; each deck is coloured like a cluster label. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E8ECF1;
  --ink: #16202B;
  --muted: #586574;
  --line: #D6DDE5;
  --accent: #2F5D8A;
  --good: #2F7A55;
  --again: #B4492A;
  --c-ml: #2F5D8A;
  --c-uml: #2F7A55;
  --c-kmeans: #B4492A;
  --c-algo: #6E4FA3;
  --c-seed: #946C0E;
  --c-scale: #1F7A80;
  --c-eval: #A3456E;
  --shadow: 0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C; --surface: #18212B; --surface-2: #212C38; --ink: #E6ECF2; --muted: #9AA8B6; --line: #2B3745;
    --accent: #7FAEDD; --good: #6CC193; --again: #F08A68;
    --c-ml: #7FAEDD; --c-uml: #6CC193; --c-kmeans: #F08A68; --c-algo: #B79BE6; --c-seed: #E2B94D; --c-scale: #5CC4CB; --c-eval: #E58AB0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C; --surface: #18212B; --surface-2: #212C38; --ink: #E6ECF2; --muted: #9AA8B6; --line: #2B3745;
  --accent: #7FAEDD; --good: #6CC193; --again: #F08A68;
  --c-ml: #7FAEDD; --c-uml: #6CC193; --c-kmeans: #F08A68; --c-algo: #B79BE6; --c-seed: #E2B94D; --c-scale: #5CC4CB; --c-eval: #E58AB0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

/* filters */
.filters { display: flex; flex-direction: column; gap: 10px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rowlabel { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-right: 4px; }
.chip {
  font: 500 14px/1 var(--f-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip:focus-visible, .btn:focus-visible, .card:focus-visible, .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 14px/1 var(--f-body); color: var(--muted); background: none; border: 0; padding: 9px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 500 14px/1 var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* progress */
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; gap: 12px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; transition: width .3s ease; }
.bar .k { background: var(--good); }
.bar .a { background: var(--again); }

/* card */
.stage { perspective: 1400px; }
.card {
  display: grid; cursor: pointer; position: relative;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1);
  border-radius: 18px; outline: none;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  min-height: 320px; padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 16px;
  border-top: 5px solid var(--c);
}
.face.back { transform: rotateY(180deg); }
.facehead { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.facehead .deck { display: inline-flex; align-items: center; gap: 8px; color: var(--c); }
.facehead .deck::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.facehead .num { font-variant-numeric: tabular-nums; }
.q { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 4vw, 28px); line-height: 1.25; margin: auto 0; text-wrap: balance; }
.a { font-size: 17px; line-height: 1.6; margin: auto 0; min-width: 0; overflow-wrap: anywhere; }
.a p { margin: 0 0 10px; }
.a p:last-child { margin-bottom: 0; }
.a ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.hint { font-size: 13px; color: var(--muted); }
.side-tag { font-family: var(--f-mono); font-size: 12px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.formula { font-family: var(--f-mono); font-size: .95em; display: block; background: var(--surface-2); padding: 8px 12px; border-radius: 8px; margin: 4px 0; overflow-x: auto; white-space: nowrap; }

.controls { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; align-items: stretch; }
.controls .btn { justify-content: center; padding: 12px 14px; font-size: 15px; }
.btn.again { color: var(--again); border-color: color-mix(in srgb, var(--again) 45%, var(--line)); }
.btn.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.keys { font-size: 12px; color: var(--muted); text-align: center; }
.keys kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; padding: 40px 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { font-family: var(--f-display); margin: 0; font-size: 24px; }
.empty p { margin: 0; color: var(--muted); }

/* list view */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); gap: 18px; }
.item .iq { font-weight: 600; }
.item .ia { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.item .ia p { margin: 0 0 6px; }
.item .ia p:last-child { margin: 0; }
.item .ia ul { margin: 0; padding-left: 18px; }
.item .state { font-size: 12px; color: var(--muted); grid-column: 1 / -1; display: flex; gap: 10px; }
.item .state b { font-weight: 600; }
.item .state .k { color: var(--good); }
.item .state .x { color: var(--again); }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; }
footer button { font: inherit; color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

@media (max-width: 560px) {
  .face { padding: 18px 18px 22px; min-height: 300px; }
  .controls { grid-template-columns: 1fr 1fr; }
  .controls .prev { order: 3; } .controls .next { order: 4; }
  .item { grid-template-columns: 1fr; gap: 8px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .bar span { transition: none; }
}

<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Machine learning · Sessions 1–3</div>
    <h1>K-means &amp; Seeds Flashcards</h1>
    <p class="lede">Review the ideas from our lessons and prepare for the scikit-learn certification exam. Read the question, answer it in your head, then flip the card and be honest about whether you knew it.</p>
  </header>

  <section class="filters" aria-label="Choose cards">
    <div class="chiprow" id="decks"></div>
  </section>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="View">
      <button id="v-study" aria-pressed="true">Study</button>
      <button id="v-list" aria-pressed="false">All cards</button>
    </div>
    <div class="tools">
      <button class="btn" id="shuffle" aria-pressed="false">Shuffle</button>
      <button class="btn" id="missed" aria-pressed="false">Only “review again”</button>
    </div>
  </div>

  <div class="progress">
    <div class="meta"><span id="pcount"></span><span id="pstat"></span></div>
    <div class="bar" aria-hidden="true"><span class="k" id="bk"></span><span class="a" id="ba"></span></div>
  </div>

  <main id="study">
    <div class="stage" id="stage"></div>
  </main>
  <main id="listview" hidden><div class="list" id="list"></div></main>

  <footer>
    <span>Your progress is saved in this browser only.</span>
    <button id="reset">Reset my progress</button>
  </footer>
</div>

<script>
const DECKS = [
  { id: "ml",     name: "What is ML?",          session: 1 },
  { id: "uml",    name: "Unsupervised learning", session: 1 },
  { id: "kmeans", name: "K-means",               session: 1 },
  { id: "algo",   name: "Algorithms",            session: 2 },
  { id: "seed",   name: "Seeds & random_state",  session: 2 },
  { id: "scale",  name: "Scaling & transformers", session: 3 },
  { id: "eval",   name: "Cluster evaluation & API", session: 3 },
];

// q = question, a = answer. Inline markup: `code`, **bold**, blank line = new paragraph, "- " lines = list.
function hash(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(36); }
const CARDS = [
  // ---- ML basics ----
  ["ml", "What is machine learning?", "A way to make computers learn the rules from examples instead of being given them.\n\nTraditional programming: rules + data → answers.\nMachine learning: data + answers → rules."],
  ["ml", "When should you **not** use machine learning?", "When a formula already works (tax calculation), when there is no data to learn from, or when every decision must follow a written rule."],
  ["ml", "What are the three learning paradigms?", "- **Supervised**: data comes with answers (labels)\n- **Unsupervised**: no answers; find structure\n- **Reinforcement**: learn by trial and reward"],
  ["ml", "Classification vs regression: what is the difference?", "Both are supervised.\n\n**Classification** predicts a category (spam / not spam). **Regression** predicts a number (a house price)."],
  ["ml", "Which paradigm and task? Find unusual bank transactions with no fraud labels.", "Unsupervised learning, anomaly detection."],
  ["ml", "What is self-supervised learning?", "Learning where the labels are made from the data itself. Large language models predict the next word, so the text supplies its own answers."],
  ["ml", "Feature vs label?", "A **feature** is one measurable property, a column of the data.\n\nA **label** is the answer column in supervised learning."],
  ["ml", "Parameter vs hyperparameter? Give the K-means example.", "A **parameter** is learned by the algorithm: the centroid positions.\n\nA **hyperparameter** is chosen by you before training: K."],
  ["ml", "What is generalization?", "Doing well on data the model has never seen. It is the real goal of ML."],
  ["ml", "Overfitting vs underfitting?", "**Overfitting**: the model memorizes noise, so it looks great on training data and does poorly on new data.\n\n**Underfitting**: the model is too simple to capture the pattern."],
  ["ml", "In a typical ML workflow, where does most of the effort go?", "Before training: collecting, cleaning and preparing the data. For K-means, a missing scaling step can make it fail completely."],

  // ---- Unsupervised learning ----
  ["uml", "What is unsupervised learning?", "Finding structure in data that has no answer key (no labels)."],
  ["uml", "Why do we need unsupervised learning? Give two reasons.", "- Labels are expensive: millions of medical scans exist, few are labelled by a radiologist.\n- The answer is unknown: a company doesn’t know its customer segments in advance."],
  ["uml", "Unsupervised learning answers four kinds of questions. Name them.", "- **Clustering**: which points belong together?\n- **Dimensionality reduction**: fewer variables, same information?\n- **Anomaly detection**: which points don’t fit?\n- **Association rules**: which items occur together?"],
  ["uml", "What is clustering?", "Grouping data points so that points in the same group are more alike than points in other groups."],
  ["uml", "Every clustering method makes two choices. What are they?", "1. How to measure **similarity** (usually a distance; K-means uses Euclidean).\n\n2. What **shape** a cluster has: a ball around a centre, a dense region, or a nested tree."],
  ["uml", "Hard vs soft clustering?", "**Hard**: each point belongs to exactly one cluster (K-means).\n\n**Soft**: each point gets a probability for each cluster (Gaussian mixtures)."],
  ["uml", "A deck of cards can be grouped by suit, by colour, or into face cards vs the rest. Which grouping is correct?", "All of them. With no answer key, “correct” depends on what you need the groups for."],
  ["uml", "What are the three ways to judge clusters?", "- **Internal**: uses only the data (inertia, silhouette)\n- **External**: needs true labels to compare (adjusted Rand index)\n- **Usefulness**: can someone act on the clusters?\n\nIn practice, usefulness matters most."],

  // ---- K-means ----
  ["kmeans", "Explain K-means with the pizza-shop analogy.", "Open K pizza shops anywhere in the city. Each house picks its nearest shop. Each shop moves to the centre of its customers. Repeat until no shop moves."],
  ["kmeans", "What is a centroid?", "The centre of a cluster: the mean (average) of all points in it."],
  ["kmeans", "Which two steps does K-means repeat?", "1. **Assign**: each point joins its nearest centroid.\n\n2. **Update**: each centroid moves to the mean of its points."],
  ["kmeans", "When does K-means stop?", "When no point changes cluster, when the centroids move less than a small tolerance, or when `max_iter` is reached (300 by default)."],
  ["kmeans", "Why is K-means guaranteed to stop?", "Each step can only lower J or keep it the same, and there are only finitely many ways to split the points. So no split can repeat, and the loop must end."],
  ["kmeans", "Does K-means always find the best clustering?", "No. It stops at a **local minimum**. Finding the global best is NP-hard, so the starting centroids matter."],
  ["kmeans", "Two runs of K-means give different clusters. Why, and what do you do?", "Different random starts reach different local minima. Use k-means++ with several restarts (`n_init`), and set `random_state` if you need the same result every time."],
  ["kmeans", "What does k-means++ do?", "It spreads the starting centroids apart: each next centroid is picked with probability proportional to its squared distance from the nearest centroid already chosen. It is scikit-learn’s default."],
  ["kmeans", "What does `n_init` do?", "Runs K-means several times from different starts and keeps the run with the lowest inertia. It protects against one unlucky start."],
  ["kmeans", "Why can’t inertia alone tell you the best K?", "Inertia always falls as K grows. With K = number of points, it reaches 0, which is useless."],
  ["kmeans", "How does the elbow method choose K?", "Plot inertia against K. Inertia drops sharply, then flattens. The K at the bend (the elbow) is a good choice."],
  ["kmeans", "Features are age (years) and income (euros). What must you do before K-means, and why?", "**Standardize** the features (e.g. `StandardScaler`).\n\nIncome is about 1,000 times larger, so it dominates every distance. In our demo the adjusted Rand index was 0.0 on raw features and 1.0 after scaling."],
  ["kmeans", "Why does K-means fail on the “two moons” dataset? What could you use instead?", "K-means draws straight boundaries and assumes round clusters, so it cuts each moon in half. DBSCAN or spectral clustering can follow the curved shape."],
  ["kmeans", "Name three other weaknesses of K-means and an alternative for each.", "- **Outliers** pull the mean → K-medoids\n- **Categorical data** has no mean → K-modes\n- **Many dimensions** make distances similar → PCA, then cluster\n- **Unknown K** → hierarchical clustering, DBSCAN"],

  // ---- Algorithms ----
  ["algo", "What is an algorithm?", "A finite list of precise steps that turns an input into an output. Like a recipe that anyone, or any machine, can follow and get the same result."],
  ["algo", "Looking up a word in a paper dictionary (open in the middle, go left or right, repeat) is which algorithm?", "**Binary search.**"],
  ["algo", "Name the five properties of an algorithm.", "- **Input**: zero or more inputs\n- **Output**: at least one result\n- **Definiteness**: every step is exact\n- **Finiteness**: it stops after a finite number of steps\n- **Effectiveness**: every step can actually be carried out"],
  ["algo", "In the tea algorithm, which property does “Boil 250 ml of water” fix that “Boil some water” breaks?", "**Definiteness**: every step must be exact and leave nothing to guess."],
  ["algo", "Which of these is **not** a property of an algorithm: finiteness, definiteness, randomness, output?", "**Randomness.** Algorithms may use randomness, but it isn’t a defining property."],
  ["algo", "Algorithm vs program vs model?", "- **Algorithm**: the idea, the steps (“assign, update, repeat”)\n- **Program**: the algorithm written in a language (scikit-learn’s `KMeans`)\n- **Model**: the numbers you get after running a learning algorithm on data (the centroids)\n\nRecipe → recipe written in Persian → the cake you baked."],
  ["algo", "Why are there many algorithms for the same problem?", "They differ in speed, memory and quality, and each assumes different things about the data. Choosing an algorithm means choosing a set of assumptions."],
  ["algo", "Almost every learning algorithm follows the same four-step shape. What is it?", "1. Start with some numbers (parameters), often random\n2. Measure how bad they are (a loss, like inertia)\n3. Change the numbers to improve the measure\n4. Repeat until improvement stops"],
  ["algo", "After `km = KMeans(4)` and before `km.fit(X)`, does `km` contain learned centroids?", "No. Creating the object only stores your settings. `fit` does the learning."],
  ["algo", "What happens, in order, inside `KMeans(...).fit(X)`?", "1. Check the input (2-D numbers, no missing values)\n2. Turn `random_state` into a random number generator\n3. Pick starting centroids with k-means++\n4. Loop: assign, update, until converged\n5. Repeat 3–4 `n_init` times, keep the lowest inertia\n6. Store the results"],
  ["algo", "What does a trailing underscore mean in `cluster_centers_`, `labels_` or `inertia_`?", "It’s a scikit-learn convention: the attribute was **learned from data** during `fit`."],
  ["algo", "K-means with K = 4 on 2 features. How many numbers make up the whole model?", "**8**: 4 centroids × 2 coordinates. `predict` just measures distances to those 8 numbers."],
  ["algo", "Does the computer “understand” the data it clusters?", "No. It only adds, multiplies and compares numbers. Labels like “high-spending customers” are meanings we attach afterward."],

  // ---- Seeds & random_state ----
  ["seed", "Why can’t a normal computer produce truly random numbers?", "It follows exact instructions. Its “random” numbers come from a formula, a **pseudo-random number generator (PRNG)**, that only looks random."],
  ["seed", "What is a seed?", "The number that starts the pseudo-random formula. Same seed → same sequence of “random” numbers, every time."],
  ["seed", "What is `random_state` in scikit-learn?", "scikit-learn’s name for the seed. It controls every random choice an estimator makes, like starting centroids or how rows are shuffled."],
  ["seed", "What are the three kinds of values `random_state` can take?", "- `None` (default): fresh randomness, results can change\n- An integer like `0` or `42`: the same result every run\n- A generator object: shares one generator across several steps"],
  ["seed", "Why do people write `random_state=42`?", "It’s a joke from *The Hitchhiker’s Guide to the Galaxy* (“the answer to life, the universe and everything”). 42 has no special property; 0, 7 or 2026 work just as well."],
  ["seed", "You run the same code with `random_state=7` twice. What happens?", "You get **identical** results both times."],
  ["seed", "Will the same seed give the same result on another computer?", "Usually yes, with the same library versions. Different NumPy or scikit-learn versions, hardware or threads can occasionally change results slightly, so record your versions."],
  ["seed", "With `init=\"random\"` and `n_init=1`, 3 of 6 seeds got stuck in a bad K-means result. What two lessons does that teach?", "The seed decides where the algorithm starts, and a single start can be unlucky. That is why the defaults use k-means++ and several restarts."],
  ["seed", "`random_state=0` and `random_state=1` find the same clusters, but the labels look different: `[1 1 3 2…]` vs `[0 0 3 2…]`. Why?", "The groups are identical; only the cluster **numbers** are swapped. Cluster numbers are names, not meanings."],
  ["seed", "Why does `train_test_split` need a `random_state`?", "Otherwise the split changes every run, so the accuracy changes too, and you can’t tell whether a model improved or just got a luckier split."],
  ["seed", "If I set `random_state`, is my result correct?", "It is **reproducible**, not correct. Fixing the seed hides randomness; it doesn’t remove it. Try several seeds to see whether the result is stable."],
  ["seed", "When should you fix the seed, and when should you vary it?", "**Fix it** for reproducibility: homework, teaching, reports, debugging, comparing models fairly.\n\n**Vary it** to test robustness: run seeds 0–4 and report the average and spread."],
  ["seed", "Your model scores 91% with seed 42 and 78% on average with seeds 0–4. What should you report?", "The average and spread across seeds. 91% was luck. Choosing the luckiest seed is cheating yourself, and it won’t generalize."],

  // ---- Session 3: Scaling & transformers (exam focus) ----
  ["scale", "Why does K-means need feature scaling?", "K-means compares points by **distance**, so the feature with the largest numbers dominates.\n\nOn the raw wine data, proline (values up to 1,680) holds 99.8% of the variance, so unscaled K-means clusters by proline alone."],
  ["scale", "What does scaling change, and what stays the same?", "It **changes** the distances between points, and so the clusters.\n\nIt **keeps** the number of rows and the order of values within each column."],
  ["scale", "Preview: does a decision tree need feature scaling?", "No. Trees split on one feature at a time, so only the order of values matters. Distance-based methods like K-means do need scaling."],
  ["scale", "What does StandardScaler produce?", "Each feature gets **mean 0** and **standard deviation 1**.\n\nThe output is **not** bounded: values like −2.3 or 4.1 are normal."],
  ["scale", "True or false: after StandardScaler, every feature follows a normal distribution.", "**False.** It only shifts and rescales. A skewed feature stays exactly as skewed."],
  ["scale", "What range does MinMaxScaler produce, and what happens to a new value larger than the fitted maximum?", "[0, 1] by default (change it with `feature_range`).\n\nA new value above the fitted max becomes **greater than 1**, unless you set `clip=True`."],
  ["scale", "Which scalers are sensitive to outliers, and which one is not?", "**MinMaxScaler** and **StandardScaler** are sensitive (they use min/max and mean/std).\n\n**RobustScaler** is robust: it uses the **median** and the **interquartile range (IQR)**."],
  ["scale", "A feature has values 10, 12, 11, 13, 500. Which scaler keeps the spacing of the first four values sensible?", "**RobustScaler**, because the median and IQR ignore the extreme value 500."],
  ["scale", "True or false: RobustScaler removes outliers.", "**False.** The outlier is still there (in class, the CEO’s salary became 16). It just doesn’t distort how the other values are scaled."],
  ["scale", "Scalers vs transformers (QuantileTransformer, PowerTransformer): what is the key difference?", "Scalers only **shift and stretch**; the shape of the distribution stays the same.\n\nTransformers **reshape** the distribution, for example making a skewed feature bell-shaped."],
  ["scale", "Which two output distributions can QuantileTransformer produce?", "`uniform` (the default, values between 0 and 1) or `normal` (set `output_distribution=\"normal\"`)."],
  ["scale", "PowerTransformer: Box-Cox vs Yeo-Johnson?", "**Box-Cox** works only on strictly positive data (it raises an error otherwise).\n\n**Yeo-Johnson** works on any values and is the **default**."],
  ["scale", "Does PowerTransformer standardize its output?", "Yes. `standardize=True` is the default, so the result has mean 0 and std 1. No extra StandardScaler is needed."],
  ["scale", "Which scaler fits each case? Bounded scores (0–100), a right-skewed income, outliers you want to keep, everything else.", "- Bounded scores → **MinMaxScaler**\n- Right-skewed income → **PowerTransformer**\n- Outliers you want to keep → **RobustScaler**\n- Everything else → **StandardScaler**"],
  ["scale", "On new or held-back data, do you call `fit_transform` or `transform`?", "`transform`. Never refit the scaler on new data; reuse the statistics learned in `fit`."],
  ["scale", "What does `scaler.transform(X_new)` use?", "The statistics learned during `fit` (for StandardScaler, `mean_` and `scale_`), not X_new’s own mean and standard deviation."],
  ["scale", "A data scientist runs `StandardScaler().fit_transform(X)` and then `train_test_split`. What is wrong?", "**Data leakage.** The scaler has already seen the test rows.\n\nSplit first, fit the scaler on the training part only, then `transform` the test part."],
  ["scale", "How do you report K-means centroids in real units after scaling?", "`scaler.inverse_transform(km.cluster_centers_)`"],
  ["scale", "What does `ColumnTransformer` let you do?", "Apply a different transformer to different columns (e.g. RobustScaler on income, MinMaxScaler on a score) and glue the results into one array."],
  ["scale", "A ColumnTransformer lists only `age` and `income`, but the table also has `score`. What happens to `score`?", "It is **dropped** (the default is `remainder=\"drop\"`). Use `remainder=\"passthrough\"` to keep it unchanged."],
  ["scale", "Why put the scaler and K-means in a `Pipeline`?", "The steps always run in the right order, with the right method: `fit` does `fit_transform` on the scaler, then `fit` on K-means; `predict` does `transform`, then `predict`. That prevents leakage and forgotten steps."],
  ["scale", "In `make_pipeline(StandardScaler(), KMeans())`, how do you set the number of clusters to 4?", "`pipe.set_params(kmeans__n_clusters=4)`\n\nStep name (lower-case class name with `make_pipeline`), then **two underscores**, then the parameter."],

  // ---- Session 3: Cluster evaluation & the estimator API (exam focus) ----
  ["eval", "Inertia for K = 2, 3, 4 is 1659, 1278 and 1181. A colleague picks K = 4 because it is lowest. What is wrong?", "Inertia **always decreases** as K grows (it reaches 0 when every point is its own cluster). Use the elbow method and the silhouette score instead."],
  ["eval", "How does the elbow method choose K?", "Plot inertia for K = 1, 2, … and pick the K where the drops change from large to small (the bend). It is a visual judgement and can be ambiguous."],
  ["eval", "What range does the silhouette score have, and what do its values mean?", "−1 to 1.\n\n- Near 1: well inside its own cluster\n- Around 0: on the border between clusters\n- Negative: closer to another cluster, probably misplaced"],
  ["eval", "`silhouette_score(X, labels)` returns −0.05. What does it suggest?", "Many points are closer to another cluster than to their own: the clustering is poor."],
  ["eval", "Why can’t you compute the silhouette score for K = 1?", "Each point needs a nearest **other** cluster. scikit-learn requires between 2 and n − 1 clusters and raises an error otherwise."],
  ["eval", "Where does `silhouette_score` live, and what does it take?", "It is a function in `sklearn.metrics`, not a KMeans method. It takes the **data** and the **labels**: `silhouette_score(X_scaled, labels)`."],
  ["eval", "`silhouette_score` vs `silhouette_samples`?", "`silhouette_score` returns one number, the mean for the whole clustering.\n\n`silhouette_samples` returns one value per point, which you need for a silhouette plot."],
  ["eval", "Internal vs external clustering scores?", "**Internal** (inertia, silhouette, Davies–Bouldin, Calinski–Harabasz) use only X and the labels.\n\n**External** (adjusted Rand index) compare with true labels, so they’re only possible when the true groups are known."],
  ["eval", "Silhouette 0.57 on raw data vs 0.29 on standardized data. Which clustering is better?", "You **can’t compare** them: they are computed on different data. On the wine data the raw version actually matched the real groups far worse (ARI 0.37 vs 0.90)."],
  ["eval", "What is a radar chart used for in clustering?", "To **profile** clusters: one axis per feature, one shape per cluster, so you can see and name what makes each cluster different."],
  ["eval", "Should a radar chart show raw or scaled cluster means?", "**Scaled.** In raw units the biggest feature fills the chart. Put a table in real units next to it for stakeholders."],
  ["eval", "Name two pitfalls of radar charts.", "- More than about 8 axes or 4–5 clusters becomes unreadable\n- The **area** has no meaning: it depends on the order of the axes, so compare axis by axis"],
  ["eval", "What does `StandardScaler().fit(X)` return?", "The fitted **StandardScaler object** itself, not the scaled data. That is why calls can be chained: `.fit(X).transform(X)`."],
  ["eval", "Which methods does KMeans have?", "All five: `fit`, `transform`, `fit_transform`, `predict`, `fit_predict`."],
  ["eval", "`km.fit_predict(X)` gives the same result as which of these: `km.fit(X).labels_`, `km.transform(X)`, `km.score(X)`, `km.cluster_centers_`?", "`km.fit(X).labels_`"],
  ["eval", "Can you call `km.predict(X_new)` after `km.fit_predict(X)`?", "Yes. `fit_predict` also fits the model, so new points can then be assigned to the nearest centroid."],
  ["eval", "What does `KMeans.transform(X)` return?", "The **distance from each point to each centroid**, shape (n_samples, n_clusters). It does not return labels."],
  ["eval", "X is 300 × 2. What is the shape of `KMeans(n_clusters=4).fit_transform(X)`?", "**(300, 4)**: one distance per point per centroid."],
  ["eval", "Which call fails: `KMeans(3).fit(X).predict(X_new)`, `StandardScaler().fit(X).predict(X_new)`, `StandardScaler().fit(X).transform(X_new)`?", "`StandardScaler().fit(X).predict(X_new)`: a scaler has **no** `predict`."],
  ["eval", "Which methods does a Pipeline offer?", "Those of its **last** step. `make_pipeline(StandardScaler(), KMeans(3))` has `fit_predict` and `predict` because KMeans does."],
  ["eval", "Preview for the exam: which clustering algorithms have `fit_predict` but no `predict`?", "DBSCAN and AgglomerativeClustering. They label the data they were fitted on but can’t assign new points."],
].map(c => ({ id: c[0] + "-" + hash(c[1]), deck: c[0], q: c[1], a: c[2] }));

const deckById = Object.fromEntries(DECKS.map(d => [d.id, d]));
const KEY = "ml-flashcards-v2";

let store = { known: {}, decks: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && typeof s === "object") store = Object.assign(store, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const state = {
  decks: new Set(Array.isArray(store.decks) && store.decks.length ? store.decks.filter(d => deckById[d]) : DECKS.map(d => d.id)),
  shuffle: false, missedOnly: false, view: "study",
  order: [], pos: 0, flipped: false,
};
if (!state.decks.size) DECKS.forEach(d => state.decks.add(d.id));

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
}
function render(text) {
  return text.split(/\n\n/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => l.startsWith("- "))) return "<ul>" + lines.map(l => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
    if (lines.length === 1 && /^`[^`]+`$/.test(lines[0])) return '<span class="formula">' + esc(lines[0].slice(1, -1)) + "</span>";
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}

function pool() {
  return CARDS.filter(c => state.decks.has(c.deck) && (!state.missedOnly || store.known[c.id] === false));
}
function rebuild(keepCurrent) {
  const cur = state.order[state.pos];
  let ids = pool().map(c => c.id);
  if (state.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  }
  state.order = ids;
  const idx = keepCurrent ? ids.indexOf(cur) : -1;
  state.pos = idx >= 0 ? idx : 0;
  state.flipped = false;
  draw();
}

const $ = id => document.getElementById(id);

function drawChips() {
  const row = $("decks");
  row.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.type = "button";
  const allOn = state.decks.size === DECKS.length;
  all.setAttribute("aria-pressed", String(allOn));
  all.innerHTML = 'All decks <span class="n">' + CARDS.length + "</span>";
  all.onclick = () => { DECKS.forEach(d => state.decks.add(d.id)); store.decks = [...state.decks]; save(); drawChips(); rebuild(false); };
  row.appendChild(all);
  [1, 2, 3].forEach(sess => {
    const lab = document.createElement("span");
    lab.className = "rowlabel"; lab.textContent = "Session " + sess;
    lab.style.marginLeft = "6px";
    row.appendChild(lab);
    DECKS.filter(d => d.session === sess).forEach(d => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.style.setProperty("--c", "var(--c-" + d.id + ")");
      const on = !allOn && state.decks.has(d.id);
      b.setAttribute("aria-pressed", String(on));
      const n = CARDS.filter(c => c.deck === d.id).length;
      b.innerHTML = '<span class="dot"></span>' + esc(d.name) + ' <span class="n">' + n + "</span>";
      b.onclick = () => {
        if (allOn) { state.decks = new Set([d.id]); }
        else if (state.decks.has(d.id)) { state.decks.delete(d.id); if (!state.decks.size) DECKS.forEach(x => state.decks.add(x.id)); }
        else state.decks.add(d.id);
        store.decks = [...state.decks]; save(); drawChips(); rebuild(false);
      };
      row.appendChild(b);
    });
  });
}

function drawProgress() {
  const inDecks = CARDS.filter(c => state.decks.has(c.deck));
  const k = inDecks.filter(c => store.known[c.id] === true).length;
  const a = inDecks.filter(c => store.known[c.id] === false).length;
  const n = inDecks.length;
  $("pcount").textContent = state.view === "study" && state.order.length
    ? "Card " + (state.pos + 1) + " of " + state.order.length
    : state.order.length + " cards";
  $("pstat").textContent = k + " known · " + a + " to review · " + (n - k - a) + " not seen";
  $("bk").style.width = (n ? k / n * 100 : 0) + "%";
  $("ba").style.width = (n ? a / n * 100 : 0) + "%";
  $("missed").textContent = "Only “review again” (" + a + ")";
}

function drawStudy() {
  const stage = $("stage");
  if (!state.order.length) {
    stage.innerHTML = '<div class="empty"><h2>Nothing to review here</h2><p>You have no cards marked “review again” in these decks.</p><button class="btn" id="showall">Show all cards</button></div>';
    $("showall").onclick = () => { state.missedOnly = false; $("missed").setAttribute("aria-pressed", "false"); rebuild(false); };
    return;
  }
  const card = CARDS.find(c => c.id === state.order[state.pos]);
  const d = deckById[card.deck];
  const mark = store.known[card.id];
  const status = mark === true ? "Known" : mark === false ? "Review again" : "";
  stage.innerHTML =
    '<div class="card' + (state.flipped ? " flipped" : "") + '" id="card" tabindex="0" role="button" aria-label="Flashcard, ' + (state.flipped ? "answer side" : "question side") + '. Press to flip." style="--c: var(--c-' + d.id + ')">' +
      '<div class="face front" aria-hidden="' + state.flipped + '">' +
        '<div class="facehead"><span class="deck">' + esc(d.name) + '</span><span class="num">' + (status ? status + " · " : "") + "Q " + (state.pos + 1) + "/" + state.order.length + "</span></div>" +
        '<div class="q">' + inline(card.q) + "</div>" +
        '<div class="hint">Tap the card or press Space to see the answer</div>' +
      "</div>" +
      '<div class="face back" aria-hidden="' + !state.flipped + '">' +
        '<div class="facehead"><span class="deck">' + esc(d.name) + '</span><span class="num">Answer</span></div>' +
        '<div class="a">' + render(card.a) + "</div>" +
        '<div class="hint">' + inline(card.q) + "</div>" +
      "</div>" +
    "</div>" +
    '<div class="controls" style="margin-top:16px">' +
      '<button class="btn prev" id="prev" aria-label="Previous card"' + (state.pos === 0 ? " disabled" : "") + ">←</button>" +
      '<button class="btn again" id="again">Review again</button>' +
      '<button class="btn good" id="good">I knew it</button>' +
      '<button class="btn next" id="next" aria-label="Next card"' + (state.pos >= state.order.length - 1 ? " disabled" : "") + ">→</button>" +
    "</div>" +
    '<p class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> review again · <kbd>2</kbd> I knew it</p>';
  const el = $("card");
  el.onclick = flip;
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("again").onclick = () => markCard(false);
  $("good").onclick = () => markCard(true);
}

function drawList() {
  const list = $("list");
  if (!state.order.length) { list.innerHTML = '<div class="empty"><h2>Nothing to show</h2><p>No cards match these filters.</p></div>'; return; }
  list.innerHTML = state.order.map(id => {
    const c = CARDS.find(x => x.id === id), d = deckById[c.deck], m = store.known[c.id];
    const st = m === true ? '<b class="k">Known</b>' : m === false ? '<b class="x">Review again</b>' : "Not seen yet";
    return '<article class="item" style="--c: var(--c-' + d.id + ')"><div class="iq">' + inline(c.q) + '</div><div class="ia">' + render(c.a) + '</div><div class="state"><span>' + esc(d.name) + "</span><span>·</span>" + st + "</div></article>";
  }).join("");
}

function draw() {
  $("study").hidden = state.view !== "study";
  $("listview").hidden = state.view !== "list";
  if (state.view === "study") drawStudy(); else drawList();
  drawProgress();
}

function flip() {
  state.flipped = !state.flipped;
  const el = $("card");
  if (!el) return;
  el.classList.toggle("flipped", state.flipped);
  el.querySelector(".front").setAttribute("aria-hidden", String(state.flipped));
  el.querySelector(".back").setAttribute("aria-hidden", String(!state.flipped));
}
function go(step) {
  const np = state.pos + step;
  if (np < 0 || np >= state.order.length) return;
  state.pos = np; state.flipped = false; draw();
  const el = $("card"); if (el) el.focus({ preventScroll: true });
}
function markCard(known) {
  const id = state.order[state.pos];
  if (!id) return;
  store.known[id] = known; save();
  if (state.missedOnly && known) {
    state.order.splice(state.pos, 1);
    if (state.pos >= state.order.length) state.pos = Math.max(0, state.order.length - 1);
    state.flipped = false; draw();
  } else if (state.pos < state.order.length - 1) { go(1); }
  else { draw(); }
}

$("v-study").onclick = () => { state.view = "study"; $("v-study").setAttribute("aria-pressed", "true"); $("v-list").setAttribute("aria-pressed", "false"); draw(); };
$("v-list").onclick = () => { state.view = "list"; $("v-list").setAttribute("aria-pressed", "true"); $("v-study").setAttribute("aria-pressed", "false"); draw(); };
$("shuffle").onclick = () => { state.shuffle = !state.shuffle; $("shuffle").setAttribute("aria-pressed", String(state.shuffle)); rebuild(false); };
$("missed").onclick = () => { state.missedOnly = !state.missedOnly; $("missed").setAttribute("aria-pressed", String(state.missedOnly)); rebuild(false); };
$("reset").onclick = function () {
  if (this.dataset.armed) { store.known = {}; save(); delete this.dataset.armed; this.textContent = "Reset my progress"; rebuild(false); return; }
  this.dataset.armed = "1"; this.textContent = "Click again to clear all marks";
  setTimeout(() => { if (this.dataset.armed) { delete this.dataset.armed; this.textContent = "Reset my progress"; } }, 4000);
};

document.addEventListener("keydown", e => {
  if (state.view !== "study" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && t.tagName === "BUTTON" && t.id !== "card" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "1") markCard(false);
  else if (e.key === "2") markCard(true);
});

drawChips();
rebuild(false);
</script>
</body>
</html>
